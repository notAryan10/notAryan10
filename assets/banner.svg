<svg width="1000" height="260" viewBox="0 0 1000 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F2620"/>
      <stop offset="100%" stop-color="#152F27"/>
    </linearGradient>
  </defs>

  <!-- base -->
  <rect width="1000" height="260" fill="url(#bg)"/>

  <!-- scanlines -->
  <g opacity="0.06">
    <rect x="0" y="0" width="1000" height="260" fill="url(#bg)"/>
    <g stroke="#F2E9DC">
      <line x1="0" y1="20" x2="1000" y2="20" stroke-width="1"/>
      <line x1="0" y1="44" x2="1000" y2="44" stroke-width="1"/>
      <line x1="0" y1="68" x2="1000" y2="68" stroke-width="1"/>
      <line x1="0" y1="92" x2="1000" y2="92" stroke-width="1"/>
      <line x1="0" y1="116" x2="1000" y2="116" stroke-width="1"/>
      <line x1="0" y1="140" x2="1000" y2="140" stroke-width="1"/>
      <line x1="0" y1="164" x2="1000" y2="164" stroke-width="1"/>
      <line x1="0" y1="188" x2="1000" y2="188" stroke-width="1"/>
      <line x1="0" y1="212" x2="1000" y2="212" stroke-width="1"/>
      <line x1="0" y1="236" x2="1000" y2="236" stroke-width="1"/>
    </g>
  </g>

  <!-- cartridge frame -->
  <rect x="10" y="10" width="980" height="240" fill="none" stroke="#E8B23C" stroke-width="4"/>
  <rect x="18" y="18" width="964" height="224" fill="none" stroke="#E8B23C" stroke-width="1" opacity="0.5"/>

  <!-- corner ticks -->
  <rect x="10" y="10" width="16" height="16" fill="#E8B23C"/>
  <rect x="974" y="10" width="16" height="16" fill="#E8B23C"/>
  <rect x="10" y="234" width="16" height="16" fill="#E8B23C"/>
  <rect x="974" y="234" width="16" height="16" fill="#E8B23C"/>

  <!-- life row (5 pips, one hollow = "one more respawn") -->
  <g transform="translate(40, 40)">
    <path d="M0,8 a8,8 0 0,1 16,0 a8,8 0 0,1 16,0 c0,10 -16,20 -16,20 c0,0 -16,-10 -16,-20 z" fill="#E2725B"/>
    <path d="M40,8 a8,8 0 0,1 16,0 a8,8 0 0,1 16,0 c0,10 -16,20 -16,20 c0,0 -16,-10 -16,-20 z" fill="#E2725B"/>
    <path d="M80,8 a8,8 0 0,1 16,0 a8,8 0 0,1 16,0 c0,10 -16,20 -16,20 c0,0 -16,-10 -16,-20 z" fill="#E2725B"/>
    <path d="M120,8 a8,8 0 0,1 16,0 a8,8 0 0,1 16,0 c0,10 -16,20 -16,20 c0,0 -16,-10 -16,-20 z" fill="#E2725B"/>
    <path d="M160,8 a8,8 0 0,1 16,0 a8,8 0 0,1 16,0 c0,10 -16,20 -16,20 c0,0 -16,-10 -16,-20 z" fill="none" stroke="#E2725B" stroke-width="2"/>
  </g>

  <text x="940" y="60" text-anchor="end" font-family="monospace" font-size="14" fill="#6B9E78" letter-spacing="2">KALYAN, IN</text>

  <!-- player label -->
  <text x="40" y="120" font-family="monospace" font-size="16" fill="#6B9E78" letter-spacing="4">PLAYER ONE</text>

  <!-- name -->
  <text x="40" y="165" font-family="monospace" font-weight="bold" font-size="46" fill="#F2E9DC" letter-spacing="1">ARYAN VERMA</text>

  <!-- subtitle + blinking cursor -->
  <text x="40" y="200" font-family="monospace" font-size="18" fill="#E8B23C">CS / AI&#8211;ML &#183; MOBILE DEV &#183; RUNS R.E.Y</text>
  <rect x="530" y="186" width="12" height="18" fill="#F2E9DC">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.51;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- footer prompt -->
  <text x="40" y="230" font-family="monospace" font-size="13" fill="#8FB79A" letter-spacing="2">PRESS README TO CONTINUE &#9654;</text>
</svg>
