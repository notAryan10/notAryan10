  </g>

  <!-- Q4: Craft & Tools -->
  <g font-family="monospace" font-size="16">
    <text x="540" y="290" fill="#E2725B" font-weight="bold">Craft &amp; Tools</text>
    <text x="540" y="320" fill="#F2E9DC">├── After Effects</text>
    <text x="770" y="320" fill="#6B9E78">video editing</text>
    <text x="540" y="348" fill="#F2E9DC">├── Figma</text>
    <text x="540" y="376" fill="#F2E9DC">├── MySQL</text>
